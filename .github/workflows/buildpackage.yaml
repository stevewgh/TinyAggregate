name: Build, Test Package

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    name: CI
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # - name: Dump github context
    #   if: false
    #   run: echo ${{github.event.repository.default_branch}}
    #   shell: bash
    #   env:
    #     GITHUB_CONTEXT: ${{ toJson(github) }}

    - name: Setup dotnet
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: '6.0'

    - name: Fix NuGet sources
      run: dotnet nuget add source https://nuget-pull.hudltools.com

    - name: List NuGet sources
      run: dotnet nuget list source

    - name: Detect if using the default branch
      shell: bash
      run: |
        IS_DEFAULT=$([ ${{ github.ref_name }} = ${{github.event.repository.default_branch}} ] && echo "truey" || echo "false")
        echo "##[set-output name=is_default_branch;]$(echo $IS_DEFAULT)"
      id: detect_default_branch

    - name: Version suffix
      id: version_suffix
      shell: bash
      run: |-
        # NuGet has a limit of 20 chars for its prerelease strings, so the combined length of these
        # shouldn't exceed that.
        LOCAL_BRANCH=`echo ${{ github.ref_name }} | sed 's/[^a-zA-Z0-9]//g' | cut -c -14`
        GIT_COMMIT_SHA1=`echo ${{ github.sha }} | sed 's/[^a-zA-Z0-9]//g' | cut -c -6`

        # If our "publish official" flag is true and we're on the default branch, don't output a prerelease string.
        if [ ${{steps.detect_default_branch.outputs.is_default_branch}} = "true" ]; then
          echo "##[set-output name=suffix;]"
        else
          echo "##[set-output name=suffix;]$(echo $LOCAL_BRANCH$GIT_COMMIT_SHA1)"
          echo "##[set-output name=formatted-suffix;]$(echo --version-suffix $LOCAL_BRANCH$GIT_COMMIT_SHA1)"
        fi

    - name: Echo suffix
      run: echo ${{steps.version_suffix.outputs.formatted-suffix}}



